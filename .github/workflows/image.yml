name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a publish that runs. A cancel can leave a tag without a signature.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  check:
    uses: ./.github/workflows/publish-check.yml

  build:
    name: build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - system: x86_64-linux
            arch: amd64
            runner: ubuntu-24.04
          - system: aarch64-linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Restores the Nix store from an earlier run. See ci.yml.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.sum', 'nix/**') }}
          restore-prefixes-first-match: nix-image-${{ runner.os }}-${{ runner.arch }}-
      # Each runner builds the image for its own system. Nix does not need emulation.
      - name: Build the image
        run: nix build .#packages.${{ matrix.system }}.docker --print-build-logs
      - name: Copy the image archive
        run: cp --dereference result "image-${{ matrix.arch }}.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0

  publish:
    name: push, merge, and sign
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless cosign signs with the OIDC token of this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Log in to the registry
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Push the images
        id: images
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            nix run --inputs-from . nixpkgs#skopeo -- copy --format oci \
              --digestfile "$RUNNER_TEMP/$arch.digest" \
              "docker-archive:images/image-$arch.tar" "docker://$image:${GITHUB_SHA::7}-$arch"
            digest=$(cat "$RUNNER_TEMP/$arch.digest")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The registry image digest is not valid."
              exit 1
            fi
            echo "$arch=$image@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Create the multi-arch index
        id: index
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          tags=(-t "$image:$short")
          case "$GITHUB_REF" in
            refs/heads/main) tags+=(-t "$image:main") ;;
            # A tag with "-" is a prerelease. It does not move "latest".
            refs/tags/v*-*)  tags+=(-t "$image:${GITHUB_REF_NAME#v}") ;;
            refs/tags/v*)    tags+=(-t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "$AMD64_REF" "$ARM64_REF"
          digest=$(docker buildx imagetools inspect "$image:$short" --format '{{json .Manifest}}' | jq -r .digest)
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
        env:
          AMD64_REF: ${{ steps.images.outputs.amd64 }}
          ARM64_REF: ${{ steps.images.outputs.arm64 }}
      # --recursive also signs the manifest of each architecture.
      - name: Sign the image
        run: nix run --inputs-from . nixpkgs#cosign -- sign --yes --recursive "$REF"
        env:
          REF: ${{ steps.index.outputs.ref }}
      - name: Verify the signature
        run: |
          nix run --inputs-from . nixpkgs#cosign -- verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" > /dev/null
        env:
          REF: ${{ steps.index.outputs.ref }}
