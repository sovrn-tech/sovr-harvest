name: Publish check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: Check publish ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the event and ref
        env:
          REF_DELETED: ${{ github.event.deleted || false }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF:$REF_DELETED" in
            push:refs/heads/main:false|workflow_dispatch:refs/heads/main:false|push:refs/tags/v*:false) ;;
            *)
              echo "::error::Publish requires a push to main, a release tag, or a manual run on main."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check main history
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The publish commit must be on main."
            exit 1
          fi

  check:
    needs: policy
    uses: ./.github/workflows/ci.yml
